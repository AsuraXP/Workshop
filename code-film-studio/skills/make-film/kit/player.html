<!doctype html>
<meta charset="utf-8">
<title>Code Film Studio — Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0c0d14; color: #e8e4f4; font: 600 13px/1 system-ui, sans-serif; overflow: hidden; display: grid; place-items: center; }
  #stage { max-width: 100vw; max-height: 100vh; box-shadow: 0 20px 60px rgba(0,0,0,.65); background: #000; }
  body.interactive #stage { max-height: calc(100vh - 54px); }
  #ui { position: fixed; inset: auto 0 0 0; height: 48px; background: rgba(16,18,28,.94); border-top: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  #ui[hidden] { display: none; }
  button, select { background: #20243a; color: #e8e4f4; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 7px 13px; font: inherit; cursor: pointer; }
  button:hover, select:hover { background: #2c3150; }
  #scrub { flex: 1; accent-color: #f29a58; }
  #tlabel { min-width: 220px; text-align: right; color: #9e98ba; font-variant-numeric: tabular-nums; }
</style>
<canvas id="stage"></canvas>
<div id="ui" hidden>
  <button id="playbtn">Play</button>
  <input id="scrub" type="range" min="0" value="0">
  <span id="tlabel">0.00s</span>
  <select id="stylesel"></select>
  <button id="aspectbtn">16:9 / 9:16</button>
</div>
<script type="module" src="./engine/player.js"></script>
